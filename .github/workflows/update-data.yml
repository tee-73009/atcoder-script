name: update-data
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          mkdir -p data
          curl -sf https://kenkoooo.com/atcoder/resources/problems.json -o data/problems.json
          curl -sf https://kenkoooo.com/atcoder/resources/problem-models.json -o data/problem-models.json
          user=tee_73009
          from=0
          echo '[]' > all.json
          while true; do
            curl -sf "https://kenkoooo.com/atcoder/atcoder-api/v3/user/submissions?user=$user&from_second=$from" -o page.json
            n=$(jq length page.json)
            [ "$n" -eq 0 ] && break
            jq -s 'add | unique_by(.id)' all.json page.json > tmp.json && mv tmp.json all.json
            [ "$n" -lt 500 ] && break
            from=$(jq '[.[].epoch_second] | max' page.json)
          done
          mv all.json data/submissions.json
      - name: commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add data
          git diff --cached --quiet || (git commit -m "update data" && git push)
      - name: purge cache
        run: |
          for f in problems problem-models submissions; do
            curl -s "https://purge.jsdelivr.net/gh/tee-73009/atcoder-script@main/data/$f.json" > /dev/null
          done
